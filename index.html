<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RA - Fondo de Cámara Corregido</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
    
    /* Video de fondo para cámaras sin WebXR nativo (iOS / Safari) */
    #webcam {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    
    /* Renderizador 3D transparente superpuesto */
    canvas {
      position: absolute;
      top: 0; left: 0;
      z-index: 2;
      pointer-events: auto;
    }

    #ui {
      position: absolute;
      top: 15px; left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex; gap: 10px;
    }
    .btn {
      background: #007bff; color: white;
      padding: 10px 18px; border: none; border-radius: 20px;
      font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    input[type="file"] { display: none; }
    #info {
      position: absolute; bottom: 20px; width: 100%;
      text-align: center; color: white; background: rgba(0,0,0,0.6);
      padding: 8px 0; font-size: 14px; z-index: 100; pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="ui">
    <label class="btn" for="cameraInput">📷 Capturar Hoja</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
  </div>

  <div id="info">1 dedo: Mover | 2 dedos: Cambiar tamaño</div>

  <script type="module">
    import { ARButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;
    let objects = [];
    let selectedObject = null;
    let initialPinchDistance = null;
    let initialScale = null;
    let previousTouchPosition = { x: 0, y: 0 };

    init();

    async function init() {
      scene = new THREE.Scene();
      scene.background = null; // Fuerza la transparencia del fondo en la escena

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
      camera.position.set(0, 0, 1);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
      scene.add(light);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0); // Canal alfa en 0 para transparencia total
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 1. Iniciar transmisión de video de cámara en vivo para navegadores móviles
      await startWebcam();

      // 2. Integrar WebXR para dispositivos compatibles (ej. Chrome en Android)
      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          if (supported) {
            const arBtn = ARButton.createButton(renderer, { requiredFeatures: [] });
            document.body.appendChild(arBtn);
            
            renderer.xr.addEventListener('sessionstart', () => {
              document.getElementById('webcam').style.display = 'none';
            });
            renderer.xr.addEventListener('sessionend', () => {
              document.getElementById('webcam').style.display = 'block';
            });
          }
        });
      }

      document.getElementById('cameraInput').addEventListener('change', processImage);
      window.addEventListener('touchstart', onTouchStart, { passive: false });
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', () => { initialPinchDistance = null; });
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { exact: "environment" } }
        });
        document.getElementById('webcam').srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
          document.getElementById('webcam').srcObject = fallbackStream;
        } catch (e) {
          console.warn("No se pudo acceder a la cámara en vivo:", e);
        }
      }
    }

    function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const texture = new THREE.Texture(img);
          texture.needsUpdate = true;
          add3DObject(texture);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function add3DObject(texture) {
      const geometry = new THREE.BoxGeometry(0.25, 0.25, 0.25);
      const material = new THREE.MeshStandardMaterial({ map: texture });
      const mesh = new THREE.Mesh(geometry, material);

      mesh.position.set((Math.random() - 0.5) * 0.2, 0, -0.5);
      scene.add(mesh);
      objects.push(mesh);
      selectedObject = mesh;
    }

    function onTouchStart(e) {
      if (!selectedObject) return;
      if (e.touches.length === 1) {
        previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialScale = selectedObject.scale.x;
      }
    }

    function onTouchMove(e) {
      if (!selectedObject) return;
      e.preventDefault();

      if (e.touches.length === 1) {
        const deltaX = (e.touches[0].clientX - previousTouchPosition.x) * 0.002;
        const deltaY = (e.touches[0].clientY - previousTouchPosition.y) * 0.002;
        selectedObject.position.x += deltaX;
        selectedObject.position.y -= deltaY;
        previousTouchPosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const scale = Math.max(0.05, Math.min(initialScale * (dist / initialPinchDistance), 3));
        selectedObject.scale.set(scale, scale, scale);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    }
  </script>
</body>
</html>
