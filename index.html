<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RA Multiplataforma con Giroscopio iOS</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
    #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    canvas { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: auto; }
    #ui { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 10px; align-items: center; width: 90%; }
    .btn { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 16px; text-align: center; }
    input[type="file"] { display: none; }
    #info { position: absolute; bottom: 80px; width: 100%; text-align: center; color: white; background: rgba(0,0,0,0.8); padding: 12px 15px; font-size: 13px; z-index: 100; pointer-events: none; box-sizing: border-box; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="ui">
    <label class="btn" for="cameraInput" id="captureBtn">1. Capturar Hoja Carta</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <button class="btn" id="placeBtn" style="display:none; background: #28a745;">2. Fijar Objeto en Pantalla</button>
  </div>

  <div id="info">Solicitando cámara y sensores...</div>

  <script type="module">
    import { ARButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;
    let controller, reticle;
    let hitTestSource = null, hitTestSourceRequested = false;
    let objects = [], latestTexture = null, currentSession = null;
    let deviceAlpha = 0, deviceBeta = 0, deviceGamma = 0;

    init();

    async function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
      camera.position.set(0, 0, 0);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2);
      scene.add(light);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 0);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      await startWebcam();

      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.1, 0.13, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      if ('xr' in navigator) {
        try {
          const supported = await navigator.xr.isSessionSupported('immersive-ar');
          if (supported) {
            const arBtn = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
            document.body.appendChild(arBtn);
            renderer.xr.addEventListener('sessionstart', () => currentSession = renderer.xr.getSession());
            renderer.xr.addEventListener('sessionend', () => currentSession = null);
          }
        } catch (e) {}
      }

      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onPlaceObjectXR);
      scene.add(controller);

      document.getElementById('cameraInput').addEventListener('change', processImage);
      document.getElementById('placeBtn').addEventListener('click', requestGyroAndPlace);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    async function startWebcam() {
      const video = document.getElementById('webcam');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        await video.play();
        updateInfo("Cámara lista. Captura una hoja para continuar.");
      } catch (err) {
        updateInfo("Error: Otorga permisos de cámara en Safari/Chrome.");
      }
    }

    function requestGyroAndPlace() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
            }
            onPlaceObjectFallback();
          })
          .catch(() => onPlaceObjectFallback());
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
        onPlaceObjectFallback();
      }
    }

    function handleOrientation(event) {
      if (event.beta !== null && event.gamma !== null) {
        deviceBeta = THREE.MathUtils.degToRad(event.beta);
        deviceGamma = THREE.MathUtils.degToRad(event.gamma);
        
        if (!currentSession) {
          camera.rotation.x = deviceBeta - Math.PI / 2;
          camera.rotation.y = deviceGamma;
        }
      }
    }

    function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const texture = new THREE.Texture(img);
          texture.needsUpdate = true;
          latestTexture = texture;
          
          document.getElementById('captureBtn').style.display = 'none';
          document.getElementById('placeBtn').style.display = 'block';
          updateInfo("Imagen cargada. Toca '2. Fijar Objeto' apuntando al frente.");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function onPlaceObjectXR() {
      if (reticle.visible && latestTexture) {
        create3DObject(reticle.matrix, true);
      }
    }

    function onPlaceObjectFallback() {
      if (!latestTexture) return;

      const geometry = new THREE.BoxGeometry(0.216, 0.279, 0.01);
      const material = new THREE.MeshStandardMaterial({ map: latestTexture });
      const mesh = new THREE.Mesh(geometry, material);

      const forward = new THREE.Vector3(0, 0, -0.8);
      forward.applyQuaternion(camera.quaternion);
      mesh.position.copy(camera.position).add(forward);
      mesh.quaternion.copy(camera.quaternion);

      scene.add(mesh);
      objects.push(mesh);

      latestTexture = null;
      document.getElementById('placeBtn').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'block';
      updateInfo("Objeto fijado. Mueve el teléfono alrededor para ver la perspectiva.");
    }

    function create3DObject(matrix, isXR) {
      const geometry = new THREE.BoxGeometry(0.216, 0.279, 0.01);
      const material = new THREE.MeshStandardMaterial({ map: latestTexture });
      const mesh = new THREE.Mesh(geometry, material);

      mesh.position.setFromMatrixPosition(matrix);
      mesh.quaternion.setFromMatrixRotation(matrix);
      scene.add(mesh);
      objects.push(mesh);

      latestTexture = null;
      document.getElementById('placeBtn').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'block';
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame && currentSession) {
        if (!hitTestSourceRequested) {
          currentSession.requestReferenceSpace('viewer').then((ref) => {
            currentSession.requestHitTestSource({ space: ref }).then((src) => hitTestSource = src);
          });
          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const results = frame.getHitTestResults(hitTestSource);
          if (results.length > 0) {
            const pose = results[0].getPose(renderer.xr.getReferenceSpace());
            if (pose) {
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
            }
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    }

    function updateInfo(text) {
      document.getElementById('info').innerText = text;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
