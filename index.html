<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RA Multiplataforma con Controles (iOS & Android)</title>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
    
    /* Contenedor Superior */
    #ui { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 90%; }
    
    .btn { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.4); font-size: 16px; text-align: center; }
    
    input[type="file"] { display: none; }

    /* Panel de Controles de Ubicación y Tamaño */
    #controlsPanel { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(0,0,0,0.85); padding: 12px 18px; border-radius: 15px; color: white; width: 85%; max-width: 350px; display: none; flex-direction: column; gap: 8px; font-size: 13px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    
    .control-group { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .control-group label { width: 90px; font-weight: bold; }
    .control-group input[type="range"] { flex: 1; accent-color: #007bff; }

    #info { position: absolute; bottom: 20px; width: 100%; text-align: center; color: white; background: rgba(0,0,0,0.85); padding: 12px 15px; font-size: 13px; z-index: 1000; box-sizing: border-box; line-height: 1.4; }
    
    a { color: #00d2ff; font-weight: bold; text-decoration: underline; }
  </style>
</head>
<body>

  <div id="ui">
    <label class="btn" for="cameraInput" id="captureLabel">1. Capturar Hoja Carta</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
  </div>

  <div id="controlsPanel">
    <div class="control-group">
      <label for="scaleSlider">Tamaño:</label>
      <input type="range" id="scaleSlider" min="0.2" max="3" step="0.1" value="1">
    </div>
    <div class="control-group">
      <label for="posXSlider">Posición X:</label>
      <input type="range" id="posXSlider" min="-2" max="2" step="0.05" value="0">
    </div>
    <div class="control-group">
      <label for="posYSlider">Altura (Y):</label>
      <input type="range" id="posYSlider" min="0" max="2" step="0.05" value="0.1">
    </div>
    <div class="control-group">
      <label for="posZSlider">Posición Z:</label>
      <input type="range" id="posZSlider" min="-2" max="2" step="0.05" value="0">
    </div>
  </div>

  <div id="info">Iniciando cámara... Toma una foto a tu hoja para comenzar.</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" vr-mode-ui="enabled: false">
    
    <a-marker preset="hiro" id="marker">
      <a-box 
        id="card3D" 
        position="0 0.1 0" 
        rotation="-90 0 0" 
        scale="1 0.01 1.29" 
        material="color: #ffffff; roughness: 0.4;" 
        visible="false"
        animation="property: rotation; to: -90 360 0; loop: true; dur: 9000; easing: linear;">
      </a-box>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    const input = document.getElementById('cameraInput');
    const info = document.getElementById('info');
    const card3D = document.getElementById('card3D');
    const controlsPanel = document.getElementById('controlsPanel');

    // Elementos de los Sliders
    const scaleSlider = document.getElementById('scaleSlider');
    const posXSlider = document.getElementById('posXSlider');
    const posYSlider = document.getElementById('posYSlider');
    const posZSlider = document.getElementById('posZSlider');

    // Proporción base del objeto hoja carta (Ratio 1 : 1.29)
    const baseScale = { x: 1, y: 0.01, z: 1.29 };

    window.addEventListener('camera-init', () => {
      info.innerText = "Cámara lista. Toca '1. Capturar Hoja Carta' para tomar la foto.";
    });

    window.addEventListener('camera-error', () => {
      info.innerText = "Error de cámara. Revisa los permisos en los ajustes de tu navegador.";
    });

    // Cargar imagen y activar panel de controles
    input.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      info.innerText = "Cargando textura 3D...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const imageUrl = e.target.result;
        
        card3D.setAttribute('material', 'src', imageUrl);
        card3D.setAttribute('visible', 'true');

        // Mostrar controles
        controlsPanel.style.display = 'flex';

        info.innerHTML = "¡Proyectado! Usa los controles para ajustar posición y tamaño. Apunta al <a href='https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png' target='_blank'>Marcador HIRO</a>.";
      };
      reader.readAsDataURL(file);
    });

    // Función para actualizar escala
    scaleSlider.addEventListener('input', () => {
      const factor = parseFloat(scaleSlider.value);
      card3D.setAttribute('scale', `${baseScale.x * factor} ${baseScale.y * factor} ${baseScale.z * factor}`);
    });

    // Función para actualizar posición
    function updatePosition() {
      const x = posXSlider.value;
      const y = posYSlider.value;
      const z = posZSlider.value;
      card3D.setAttribute('position', `${x} ${y} ${z}`);
    }

    posXSlider.addEventListener('input', updatePosition);
    posYSlider.addEventListener('input', updatePosition);
    posZSlider.addEventListener('input', updatePosition);
  </script>
</body>
</html>
