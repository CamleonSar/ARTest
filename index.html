<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Realidad Aumentada - Escala y Posición</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; }
    #ui {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: #007bff;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    input[type="file"] { display: none; }
    #info {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 8px 0;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <label class="btn" for="cameraInput">📷 Capturar Hoja y Crear Objeto</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
  </div>

  <div id="info">1 dedo: Mover objeto | 2 dedos: Cambiar tamaño (Pellizco)</div>

  <script type="module">
    import { ARButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;
    let objects = [];
    let selectedObject = null;

    // Variables para gestos táctiles
    let initialPinchDistance = null;
    let initialScale = null;
    let previousTouchPosition = { x: 0, y: 0 };

    init();

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);
      camera.position.set(0, 0.5, 1.5);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Verificación y adición de WebXR
      if ('xr' in navigator) {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          if (supported) {
            document.body.appendChild(ARButton.createButton(renderer));
          } else {
            document.getElementById('info').innerText = "WebXR AR no soportado. Puedes interactuar en modo 3D estándar.";
          }
        });
      }

      document.getElementById('cameraInput').addEventListener('change', processImage);

      // Listeners para gestos (Mover y Escalar)
      window.addEventListener('touchstart', onTouchStart, { passive: false });
      window.addEventListener('touchmove', onTouchMove, { passive: false });
      window.addEventListener('touchend', onTouchEnd);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const texture = new THREE.Texture(img);
          texture.needsUpdate = true;
          add3DObject(texture);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function add3DObject(texture) {
      // Geometría del objeto (Cubo)
      const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
      const material = new THREE.MeshStandardMaterial({ map: texture });
      const mesh = new THREE.Mesh(geometry, material);

      // Posicionar frente a la cámara
      mesh.position.set((Math.random() - 0.5) * 0.3, 0, -0.6);
      
      scene.add(mesh);
      objects.push(mesh);
      selectedObject = mesh; // Seleccionar el objeto recién creado por defecto
    }

    // --- MANEJO DE GESTOS TÁCTILES ---

    function onTouchStart(e) {
      if (!selectedObject) return;

      if (e.touches.length === 1) {
        // Un dedo: Iniciar arrastre
        previousTouchPosition = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
      } else if (e.touches.length === 2) {
        // Dos dedos: Iniciar pellizco (Escala)
        initialPinchDistance = getPinchDistance(e.touches);
        initialScale = selectedObject.scale.x;
      }
    }

    function onTouchMove(e) {
      if (!selectedObject) return;
      e.preventDefault();

      if (e.touches.length === 1) {
        // Desplazar objeto en los ejes X e Y del plano
        const deltaX = (e.touches[0].clientX - previousTouchPosition.x) * 0.002;
        const deltaY = (e.touches[0].clientY - previousTouchPosition.y) * 0.002;

        selectedObject.position.x += deltaX;
        selectedObject.position.y -= deltaY;

        previousTouchPosition = {
          x: e.touches[0].clientX,
          y: e.touches[0].clientY
        };
      } else if (e.touches.length === 2 && initialPinchDistance) {
        // Escalar objeto progresivamente
        const currentDistance = getPinchDistance(e.touches);
        const factor = currentDistance / initialPinchDistance;
        const newScale = Math.max(0.05, Math.min(initialScale * factor, 3)); // Límites de tamaño

        selectedObject.scale.set(newScale, newScale, newScale);
      }
    }

    function onTouchEnd() {
      initialPinchDistance = null;
    }

    function getPinchDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render() {
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
