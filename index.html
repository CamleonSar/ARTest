<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidad Aumentada - Texturas 3D</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #ui {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 10px;
    }
    button, label {
      background: #007bff;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    input[type="file"] { display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <label for="cameraInput">📷 Agregar Foto de Hoja</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <button id="arButton" style="display:none;">Activar RA</button>
  </div>

  <script type="module">
    import { ARButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;
    let createdObjects = [];
    let spacingOffset = 0; // Para desplazar los nuevos objetos creados

    init();

    function init() {
      // 1. Crear Escena y Cámara
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      // 2. Iluminación
      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
      light.position.set(0.5, 1, 0.25);
      scene.add(light);

      // 3. Renderizador
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // 4. Botón de Realidad Aumentada (WebXR)
      document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

      // Event listener para capturar la imagen
      document.getElementById('cameraInput').addEventListener('change', processImage);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // Processar foto capturada y aplicarla al modelo 3D
    function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // Crear textura a partir de la imagen cargada
          const texture = new THREE.Texture(img);
          texture.needsUpdate = true;

          // Crear y añadir el objeto 3D a la escena
          add3DObject(texture);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // Agregar objeto 3D individual
    function add3DObject(texture) {
      // Geometría (puedes reemplazar THREE.BoxGeometry por un modelo GLTF/OBJ)
      const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2); 
      
      // Material con la textura de la foto tomada
      const material = new THREE.MeshStandardMaterial({ map: texture });
      const mesh = new THREE.Mesh(geometry, material);

      // Posicionar objetos en fila para que los participantes no los empalmen
      mesh.position.set(spacingOffset, 0, -0.5); 
      spacingOffset += 0.25; 

      scene.add(mesh);
      createdObjects.push(mesh); // Guardar en el listado global de participantes
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render() {
      // Rotación continua de objetos para vista 360°
      createdObjects.forEach(obj => {
        obj.rotation.y += 0.01;
      });
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
