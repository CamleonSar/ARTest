<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RA - Detección de Plano y Múltiples Objetos</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
    #webcam { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
    canvas { position: absolute; top: 0; left: 0; z-index: 2; pointer-events: auto; }
    #ui { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 10px; align-items: center; width: 90%; }
    .btn { background: #007bff; color: white; padding: 12px 24px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 16px; text-align: center; }
    input[type="file"] { display: none; }
    #info { position: absolute; bottom: 80px; width: 100%; text-align: center; color: white; background: rgba(0,0,0,0.7); padding: 10px 0; font-size: 14px; z-index: 100; pointer-events: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="ui">
    <label class="btn" for="cameraInput" id="captureBtn">1. Capturar Hoja Carta</label>
    <input type="file" id="cameraInput" accept="image/*" capture="environment">
    <div class="btn" id="placeBtn" style="display:none; background: #28a745;">2. Tocar pantalla para colocar</div>
  </div>

  <div id="info">1. Toma la foto | 2. Toca "START AR" abajo | 3. Mueve la cámara apuntando al suelo</div>

  <script type="module">
    import { ARButton } from 'https://unpkg.com/three@0.128.0/examples/jsm/webxr/ARButton.js';

    let camera, scene, renderer;
    let controller;
    let reticle;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let objects = [];
    let latestTexture = null;
    let currentSession = null;

    init();

    async function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2);
      scene.add(light);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // Inserción directa del botón AR (Muestra estado de compatibilidad directamente)
      const arButton = ARButton.createButton(renderer, { 
        requiredFeatures: ['hit-test'] 
      });
      document.body.appendChild(arButton);

      renderer.xr.addEventListener('sessionstart', onSessionStart);
      renderer.xr.addEventListener('sessionend', onSessionEnd);

      await startFallbackWebcam();

      // Marcador de superficie detectada (Aro verde)
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.1, 0.13, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onPlaceObject);
      scene.add(controller);

      document.getElementById('cameraInput').addEventListener('change', processImage);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function onSessionStart() {
      currentSession = renderer.xr.getSession();
      document.getElementById('webcam').style.display = 'none';
      hitTestSourceRequested = false;
      hitTestSource = null;
    }

    function onSessionEnd() {
      currentSession = null;
      document.getElementById('webcam').style.display = 'block';
      reticle.visible = false;
      hitTestSourceRequested = false;
      hitTestSource = null;
    }

    function onPlaceObject() {
      if (reticle.visible && latestTexture) {
        add3DObjectAtReticle();
      }
    }

    function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const texture = new THREE.Texture(img);
          texture.needsUpdate = true;
          latestTexture = texture;
          
          document.getElementById('captureBtn').style.display = 'none';
          document.getElementById('placeBtn').style.display = 'block';

          if (!currentSession) {
            add3DObjectFallback(texture);
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function add3DObjectAtReticle() {
      // Dimensiones proporcionales a una hoja carta (0.216m x 0.279m)
      const geometry = new THREE.BoxGeometry(0.216, 0.279, 0.01);
      const material = new THREE.MeshStandardMaterial({ map: latestTexture, metalness: 0.1, roughness: 0.8 });
      const mesh = new THREE.Mesh(geometry, material);

      mesh.position.setFromMatrixPosition(reticle.matrix);
      mesh.quaternion.setFromMatrixRotation(reticle.matrix);
      mesh.position.y += 0.005;

      scene.add(mesh);
      objects.push(mesh);
      
      latestTexture = null;
      document.getElementById('placeBtn').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'block';
    }

    function add3DObjectFallback(texture) {
      const geometry = new THREE.BoxGeometry(0.216, 0.279, 0.01);
      const material = new THREE.MeshStandardMaterial({ map: texture });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set((Math.random() - 0.5) * 0.2, 0, -0.6);
      scene.add(mesh);
      objects.push(mesh);
      latestTexture = null;
      document.getElementById('placeBtn').style.display = 'none';
      document.getElementById('captureBtn').style.display = 'block';
    }

    function animate() {
      renderer.setAnimationLoop(render);
    }

    function render(timestamp, frame) {
      if (frame && currentSession) {
        if (!hitTestSourceRequested) {
          currentSession.requestReferenceSpace('viewer').then((referenceSpace) => {
            currentSession.requestHitTestSource({ space: referenceSpace }).then((source) => {
              hitTestSource = source;
            });
          });

          currentSession.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);
          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const referenceSpace = renderer.xr.getReferenceSpace();
            const pose = hit.getPose(referenceSpace);

            if (pose) {
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
            }
          } else {
            reticle.visible = false;
          }
        }
      }

      // Rotación suave continua en eje Y
      objects.forEach(obj => {
        obj.rotation.y += 0.005;
      });

      renderer.render(scene, camera);
    }

    async function startFallbackWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } } });
        document.getElementById('webcam').srcObject = stream;
      } catch (err) {}
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
